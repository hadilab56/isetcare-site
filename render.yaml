# Render « Blueprint » : crée l'API Spring Boot (offre gratuite) à partir de backend/Dockerfile.
# Les valeurs marquées sync: false sont demandées par Render lors de la création.
services:
  - type: web
    name: isetcare-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # Chaîne « Java » de Neon (contient déjà utilisateur et mot de passe) :
      # jdbc:postgresql://ep-xxx.neon.tech/neondb?user=...&password=...&sslmode=require
      - key: DB_URL
        sync: false
      - key: CORS_ORIGINS
        value: http://localhost:5173   # remplacé ensuite par l'adresse Netlify
      - key: GEMINI_API_KEY
        sync: false   # clé gratuite : https://aistudio.google.com/apikey
      - key: JWT_SECRET
        generateValue: true
